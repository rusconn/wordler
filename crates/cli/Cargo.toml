[package]
name = "wordler-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version.workspace = true

[[bin]]
name = "wordler"
path = "src/main.rs"

[dependencies]
itertools = "0.14.0"
wordler = { path = "../core", version = "0.1.0", features = ["recommend"] }

[lints.clippy]
pedantic = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
